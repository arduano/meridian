[workspace]
members = ["crates/meridian-core", "crates/meridian-cli", "crates/meridian-ui"]
default-members = ["crates/meridian-cli", "crates/meridian-ui"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.0"

[workspace.dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
cpal = "0.15.3"
cosmic-text = "0.18.2"
enum_dispatch = "0.3.13"
flate2 = "1.1.4"
flume = "0.11.1"
glam = "0.30.8"
hound = "3.5.1"
libc = "0.2.177"
midi-toolkit-rs = { version = "0.3.1" }
midly = "0.5.3"
png = "0.18.0"
pollster = "0.4.0"
rayon = "1.10"
rfd = "0.15"
rustc-hash = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
slint = { version = "~1.15", default-features = false, features = [
    "compat-1-2",
    "std",
    "unstable-wgpu-28",
    "unstable-winit-030",
    "backend-winit-x11",
    "backend-winit-wayland",
    "renderer-femtovg",
    "renderer-skia",
    "renderer-software",
] }
thiserror = "2.0.12"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
wgpu = "28.0.0"
xsynth-core = { version = "0.4.0", features = ["serde"] }
xsynth-realtime = { version = "0.4.0", features = ["serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."meridian-core"]
opt-level = 2
codegen-units = 16

[profile.dev.package."meridian-cli"]
opt-level = 2
codegen-units = 16

[profile.release]
opt-level = 1
codegen-units = 256
incremental = true

[profile.release.package."meridian-core"]
opt-level = 3
codegen-units = 16

[profile.release.package."meridian-cli"]
opt-level = 3
codegen-units = 16

[profile.release.package."xsynth-core"]
opt-level = 3
codegen-units = 16

[profile.release.package."xsynth-realtime"]
opt-level = 3
codegen-units = 16

[profile.release.package."midi-toolkit-rs"]
opt-level = 3
codegen-units = 16
