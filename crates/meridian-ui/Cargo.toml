[package]
name = "meridian-ui"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[package.metadata.bundle]
name = "Meridian"
identifier = "io.github.arduano.meridian"
icon = [
    "../../assets/icons/meridian-16.png",
    "../../assets/icons/meridian-24.png",
    "../../assets/icons/meridian-32.png",
    "../../assets/icons/meridian-48.png",
    "../../assets/icons/meridian-64.png",
    "../../assets/icons/meridian-128.png",
    "../../assets/icons/meridian-256.png",
    "../../assets/icons/meridian-512.png",
    "../../assets/icons/meridian-1024.png",
]
category = "Music"
short_description = "Desktop MIDI visualizer frontend for Meridian"

[features]
debug-snapshots = []

[dependencies]
clap.workspace = true
meridian-core = { path = "../meridian-core" }
open = "5"
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
slint.workspace = true

[build-dependencies]
slint-build = "~1.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
