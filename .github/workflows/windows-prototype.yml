name: Windows Prototype

on:
  push:
    branches:
      - "codex/win-mac-gha-*"
      - "codex/windows-gha-prototype-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: meridian

    steps:
      - name: Checkout meridian
        uses: actions/checkout@v4
        with:
          path: meridian

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-29

      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\bin
            ~\.cargo\registry\cache
            ~\.cargo\registry\index
            ~\.cargo\registry\src
            ~\.cargo\git\db
            meridian\target
          key: windows-prototype-${{ runner.os }}-${{ hashFiles('meridian/Cargo.lock', 'meridian/Cargo.toml', 'meridian/crates/**/Cargo.toml') }}
          restore-keys: |
            windows-prototype-${{ runner.os }}-

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build CLI
        run: cargo build --release -p meridian-cli

      - name: Build UI
        run: cargo build --release -p meridian-ui

      - name: Build portable zip
        run: .\publish\windows\ci\build-portable.ps1

      - name: Smoke staged CLI
        run: .\publish\windows\ci\smoke-cli.ps1

      - name: Smoke staged UI
        run: .\publish\windows\ci\smoke-ui.ps1

      - name: Build NSIS installer
        run: .\publish\windows\ci\build-installer.ps1

      - name: Smoke installed CLI
        run: .\publish\windows\ci\smoke-installer.ps1

      - name: Verify artifacts exist
        run: |
          $artifacts = Get-ChildItem -Path publish\windows\artifacts\dist\*.zip, publish\windows\artifacts\dist\*.exe -File
          if ($artifacts.Count -eq 0) {
            throw "Missing Windows artifacts in publish\\windows\\artifacts\\dist"
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-prototype
          if-no-files-found: ignore
          path: |
            meridian/publish/windows/artifacts/dist/*.zip
            meridian/publish/windows/artifacts/dist/*.exe
