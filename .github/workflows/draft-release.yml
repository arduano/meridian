name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-version:
    name: verify-release-version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          set -euo pipefail
          bash ./scripts/check-version "${GITHUB_REF_NAME#v}"

  linux-debian-packages:
    name: linux-debian-packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: verify-release-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-29

      - name: Restore publish caches
        uses: actions/cache@v4
        with:
          path: |
            publish/linux/artifacts/.cargo-home
            publish/linux/artifacts/.rustup-home
          key: draft-release-linux-debian-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            draft-release-linux-debian-${{ runner.os }}-

      - name: Build tarball
        run: |
          set -euo pipefail
          publish/linux/archive/build.sh

      - name: Smoke tarball in Docker
        run: |
          set -euo pipefail
          publish/linux/docker/smoke-tarball.sh

      - name: Verify tarball artifact exists
        run: |
          shopt -s nullglob
          files=( publish/linux/artifacts/*.tar.gz )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "missing tarball artifact in publish/linux/artifacts" >&2
            exit 1
          fi

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-tarball
          if-no-files-found: error
          retention-days: 7
          path: |
            publish/linux/artifacts/*.tar.gz

      - name: Build deb package
        run: |
          set -euo pipefail
          publish/linux/deb/build.sh

      - name: Smoke deb package in Docker
        run: |
          set -euo pipefail
          publish/linux/docker/smoke-deb.sh

      - name: Verify deb artifact exists
        run: |
          shopt -s nullglob
          files=( publish/linux/artifacts/*.deb )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "missing deb artifact in publish/linux/artifacts" >&2
            exit 1
          fi

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-deb
          if-no-files-found: error
          retention-days: 7
          path: |
            publish/linux/artifacts/*.deb

      - name: Build AppImage
        run: |
          set -euo pipefail
          publish/linux/appimage/build.sh

      - name: Smoke AppImage in Docker
        run: |
          set -euo pipefail
          publish/linux/docker/smoke-appimage.sh

      - name: Verify AppImage artifact exists
        run: |
          shopt -s nullglob
          files=( publish/linux/artifacts/*.AppImage )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "missing AppImage artifact in publish/linux/artifacts" >&2
            exit 1
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-appimage
          if-no-files-found: error
          retention-days: 7
          path: |
            publish/linux/artifacts/*.AppImage

  linux-rpm:
    name: linux-rpm
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: verify-release-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-29

      - name: Restore publish caches
        uses: actions/cache@v4
        with:
          path: |
            publish/linux/artifacts/.cargo-home
            publish/linux/artifacts/.rustup-home
          key: draft-release-linux-rpm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            draft-release-linux-rpm-${{ runner.os }}-

      - name: Build RPM package
        run: |
          set -euo pipefail
          publish/linux/rpm/build.sh

      - name: Smoke RPM package in Docker
        run: |
          set -euo pipefail
          publish/linux/docker/smoke-rpm.sh

      - name: Verify RPM artifact exists
        run: |
          shopt -s nullglob globstar
          files=( publish/linux/artifacts/**/*.rpm )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "missing rpm artifact in publish/linux/artifacts" >&2
            exit 1
          fi

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-rpm
          if-no-files-found: error
          retention-days: 7
          path: |
            publish/linux/artifacts/**/*.rpm

  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 90
    needs: verify-release-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-29

      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\bin
            ~\.cargo\registry\cache
            ~\.cargo\registry\index
            ~\.cargo\registry\src
            ~\.cargo\git\db
            target
          key: draft-release-windows-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            draft-release-windows-${{ runner.os }}-

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build CLI
        shell: pwsh
        run: cargo build --release -p meridian-cli

      - name: Build UI
        shell: pwsh
        run: cargo build --release -p meridian-ui

      - name: Build portable zip
        shell: pwsh
        run: .\publish\windows\ci\build-portable.ps1

      - name: Smoke staged CLI
        shell: pwsh
        run: .\publish\windows\ci\smoke-cli.ps1

      - name: Smoke staged UI
        shell: pwsh
        run: .\publish\windows\ci\smoke-ui.ps1

      - name: Build NSIS installer
        shell: pwsh
        run: .\publish\windows\ci\build-installer.ps1

      - name: Smoke installed binaries
        shell: pwsh
        run: .\publish\windows\ci\smoke-installer.ps1

      - name: Verify artifacts exist
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path publish\windows\artifacts\dist\*.zip, publish\windows\artifacts\dist\*.exe -File
          if ($artifacts.Count -eq 0) {
            throw "Missing Windows artifacts in publish\\windows\\artifacts\\dist"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            publish/windows/artifacts/dist/*.zip
            publish/windows/artifacts/dist/*.exe

  macos:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: verify-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            artifact_name: release-macos-x86_64
          - runner: macos-14
            artifact_name: release-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-29

      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: draft-release-macos-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            draft-release-macos-${{ matrix.runner }}-

      - name: Build CLI
        run: cargo build --release -p meridian-cli

      - name: Build UI
        run: cargo build --release -p meridian-ui

      - name: Build portable zip
        run: bash publish/macos/ci/build-portable.sh

      - name: Smoke CLI
        run: bash publish/macos/ci/smoke-cli.sh

      - name: Smoke UI
        run: bash publish/macos/ci/smoke-ui.sh

      - name: Verify zip artifact exists
        run: |
          shopt -s nullglob
          files=( publish/macos/artifacts/dist/*.zip )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "missing macOS artifact in publish/macos/artifacts/dist" >&2
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            publish/macos/artifacts/dist/*.zip

  draft-release:
    name: draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - linux-debian-packages
      - linux-rpm
      - windows
      - macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(
            find release-artifacts -type f \
              \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.exe' \) \
              | sort
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          prerelease_flag=()
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --draft --title "$TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --draft \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes \
              "${prerelease_flag[@]}"
          fi

          mapfile -t existing_assets < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          for asset_name in "${existing_assets[@]}"; do
            gh release delete-asset "$TAG_NAME" "$asset_name" --yes
          done

          for asset_path in "${assets[@]}"; do
            gh release upload "$TAG_NAME" "$asset_path"
          done
