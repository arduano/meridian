name: Linux Publish Prototype

on:
  push:
    branches:
      - "codex/linux-gha-publish-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-publish-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-debian-packages:
    name: linux-debian-packages
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-29

      - name: Restore publish caches
        uses: actions/cache@v4
        with:
          path: |
            publish/linux/artifacts/.cargo-home
            publish/linux/artifacts/.rustup-home
          key: linux-publish-debian-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            linux-publish-debian-${{ runner.os }}-

      - name: Show Docker version
        run: docker --version

      - name: Build tarball
        run: |
          set -euo pipefail
          mkdir -p publish/linux/artifacts/logs
          publish/linux/archive/build.sh | tee publish/linux/artifacts/logs/tarball-build.log

      - name: Smoke tarball in Docker
        run: |
          set -euo pipefail
          publish/linux/docker/smoke-tarball.sh | tee publish/linux/artifacts/logs/tarball-smoke.log

      - name: Verify tarball artifact exists
        run: |
          shopt -s nullglob
          files=( publish/linux/artifacts/*.tar.gz )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "missing tarball artifact in publish/linux/artifacts" >&2
            exit 1
          fi

      - name: Upload tarball artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          if-no-files-found: error
          retention-days: 5
          path: |
            publish/linux/artifacts/*.tar.gz

      - name: Upload tarball logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball-logs
          if-no-files-found: error
          retention-days: 5
          path: |
            publish/linux/artifacts/logs/tarball-build.log
            publish/linux/artifacts/logs/tarball-smoke.log

      - name: Build deb package
        run: |
          set -euo pipefail
          publish/linux/deb/build.sh | tee publish/linux/artifacts/logs/deb-build.log

      - name: Smoke deb package in Docker
        run: |
          set -euo pipefail
          publish/linux/docker/smoke-deb.sh | tee publish/linux/artifacts/logs/deb-smoke.log

      - name: Verify deb artifact exists
        run: |
          shopt -s nullglob
          files=( publish/linux/artifacts/*.deb )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "missing deb artifact in publish/linux/artifacts" >&2
            exit 1
          fi

      - name: Upload deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          if-no-files-found: error
          retention-days: 5
          path: |
            publish/linux/artifacts/*.deb

      - name: Upload deb logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-logs
          if-no-files-found: error
          retention-days: 5
          path: |
            publish/linux/artifacts/logs/deb-build.log
            publish/linux/artifacts/logs/deb-smoke.log

      - name: Build AppImage
        run: |
          set -euo pipefail
          publish/linux/appimage/build.sh | tee publish/linux/artifacts/logs/appimage-build.log

      - name: Smoke AppImage in Docker
        run: |
          set -euo pipefail
          publish/linux/docker/smoke-appimage.sh | tee publish/linux/artifacts/logs/appimage-smoke.log

      - name: Verify AppImage artifact exists
        run: |
          shopt -s nullglob
          files=( publish/linux/artifacts/*.AppImage )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "missing AppImage artifact in publish/linux/artifacts" >&2
            exit 1
          fi

      - name: Upload AppImage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          if-no-files-found: error
          retention-days: 5
          path: |
            publish/linux/artifacts/*.AppImage

      - name: Upload AppImage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-logs
          if-no-files-found: error
          retention-days: 5
          path: |
            publish/linux/artifacts/logs/appimage-build.log
            publish/linux/artifacts/logs/appimage-smoke.log

  linux-rpm:
    name: linux-rpm
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-29

      - name: Restore publish caches
        uses: actions/cache@v4
        with:
          path: |
            publish/linux/artifacts/.cargo-home
            publish/linux/artifacts/.rustup-home
          key: linux-publish-rpm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            linux-publish-rpm-${{ runner.os }}-

      - name: Show Docker version
        run: docker --version

      - name: Build RPM package
        run: |
          set -euo pipefail
          mkdir -p publish/linux/artifacts/logs
          publish/linux/rpm/build.sh | tee publish/linux/artifacts/logs/rpm-build.log

      - name: Smoke RPM package in Docker
        run: |
          set -euo pipefail
          publish/linux/docker/smoke-rpm.sh | tee publish/linux/artifacts/logs/rpm-smoke.log

      - name: Verify RPM artifact exists
        run: |
          shopt -s nullglob globstar
          files=( publish/linux/artifacts/**/*.rpm )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "missing rpm artifact in publish/linux/artifacts" >&2
            exit 1
          fi

      - name: Upload RPM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          if-no-files-found: error
          retention-days: 5
          path: |
            publish/linux/artifacts/**/*.rpm

      - name: Upload RPM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-logs
          if-no-files-found: error
          retention-days: 5
          path: |
            publish/linux/artifacts/logs/rpm-build.log
            publish/linux/artifacts/logs/rpm-smoke.log
